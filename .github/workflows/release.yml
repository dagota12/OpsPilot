name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun run typecheck

      - name: Run automated test suite
        run: bun run test

  build-and-release:
    name: Build Binaries & Publish Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone executables
        run: |
          mkdir -p dist
          echo "Building Linux x64..."
          bun build --compile --minify --target=bun-linux-x64 ./src/index.ts --outfile dist/opspilot-linux-x64
          echo "Building Linux ARM64..."
          bun build --compile --minify --target=bun-linux-arm64 ./src/index.ts --outfile dist/opspilot-linux-arm64
          echo "Building macOS Apple Silicon (arm64)..."
          bun build --compile --minify --target=bun-darwin-arm64 ./src/index.ts --outfile dist/opspilot-darwin-arm64
          echo "Building macOS Intel (x64)..."
          bun build --compile --minify --target=bun-darwin-x64 ./src/index.ts --outfile dist/opspilot-darwin-x64
          echo "Building Windows x64..."
          bun build --compile --minify --target=bun-windows-x64 ./src/index.ts --outfile dist/opspilot-windows-x64.exe

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/opspilot-linux-x64
            dist/opspilot-linux-arm64
            dist/opspilot-darwin-arm64
            dist/opspilot-darwin-x64
            dist/opspilot-windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
